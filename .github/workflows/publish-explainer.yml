name: Publish Explainer

# After each data collection, ask Claude (uptrend-analyzer + eli5 skills) to write
# the day's explainer pages and commit them to the gh-pages branch.
# A date that is already published is skipped without calling the API.
on:
  workflow_run:
    workflows: ["Collect Finviz Data"]
    types: [completed]
  workflow_dispatch:
    inputs:
      force:
        description: "Regenerate even if today's date is already published"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publish-explainer
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements-explainer.txt

      - name: Check out gh-pages into site/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git fetch origin gh-pages
            git worktree add site gh-pages
          else
            git worktree add --orphan -b gh-pages site
          fi

      - name: Generate and publish pages
        id: generate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FORCE: ${{ inputs.force && '--force' || '' }}
        run: python run_explainer.py --site site $FORCE

      - name: Push gh-pages
        if: steps.generate.outputs.published_date != ''
        working-directory: site
        env:
          PUBLISHED_DATE: ${{ steps.generate.outputs.published_date }}
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No page changes"
          else
            git commit -m "Explainer ${PUBLISHED_DATE}"
            git push origin gh-pages
          fi

      # Runs even when generation failed: skills may already have been created,
      # and losing their IDs would create duplicates on the next run.
      - name: Save skill registry on main
        if: always()
        run: |
          git add claude_skills/registry.json 2>/dev/null || exit 0
          if git diff --cached --quiet; then
            echo "Skill registry unchanged"
            exit 0
          fi
          git commit -m "Update Claude skill registry"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "push attempt ${attempt} failed; retrying"
            sleep $((attempt * 10))
          done
          echo "::warning::could not push claude_skills/registry.json; next run reuses skills by name"
