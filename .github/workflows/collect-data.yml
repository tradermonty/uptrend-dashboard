name: Collect Finviz Data

on:
  schedule:
    # 13:10 PDT (UTC-7, Mar-Nov) = 20:10 UTC
    - cron: '10 20 * * 1-5'
    # 13:10 PST (UTC-8, Nov-Mar) = 21:10 UTC
    - cron: '10 21 * * 1-5'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write
  actions: read

concurrency:
  group: collect-data
  cancel-in-progress: false

jobs:
  check-time:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Check DST offset matches fired schedule
        id: check
        run: |
          SCHEDULE="${{ github.event.schedule }}"
          TZ_OFFSET=$(TZ='America/Los_Angeles' date +%z)
          echo "Fired schedule: ${SCHEDULE}, Pacific offset: ${TZ_OFFSET}"
          if [ "$SCHEDULE" = "10 20 * * 1-5" ] && [ "$TZ_OFFSET" = "-0700" ]; then
            echo "PDT schedule fired during PDT — running"
            echo "should_run=true" >> $GITHUB_OUTPUT
          elif [ "$SCHEDULE" = "10 21 * * 1-5" ] && [ "$TZ_OFFSET" = "-0800" ]; then
            echo "PST schedule fired during PST — running"
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "Schedule/offset mismatch — skipping"
            echo "should_run=false" >> $GITHUB_OUTPUT
          fi

  collect:
    needs: check-time
    if: needs.check-time.outputs.should_run == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pin and validate exchange session
        id: session
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/session_preflight.sh

      - name: Collect data from Finviz
        if: steps.session.outputs.eligible == 'true'
        env:
          FINVIZ_API_KEY: ${{ secrets.FINVIZ_API_KEY }}
          COLLECTION_SESSION: ${{ steps.session.outputs.session_date }}
        run: python collect.py --scope all --verbose --date "$COLLECTION_SESSION"

      - name: Export CSV files
        if: steps.session.outputs.eligible == 'true'
        run: python export_csv.py --verbose

      - name: Commit and push if data changed
        if: steps.session.outputs.eligible == 'true'
        env:
          COLLECTION_SESSION: ${{ steps.session.outputs.session_date }}
        run: |
          MANIFEST=data/collection_manifest.json
          # Data is published to main only from main; a run dispatched on another
          # branch must not replay that branch's code onto main.
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Run on $GITHUB_REF, not main: data not published"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/uptrend.db data/uptrend_ratio_timeseries.csv data/sector_summary.csv data/industry_summary.csv data/sector_dispersion.csv
          if [ -f "$MANIFEST" ]; then git add "$MANIFEST"; fi
          if ! git diff --cached --quiet; then
            git commit -m "Update uptrend data $(date -u +%Y-%m-%d)"
          fi
          # A failed run may have pushed a manifest-only commit since this checkout
          # (e.g. "Re-run failed jobs"). This run's manifest supersedes it; any other
          # conflict still fails the step.
          if ! git pull --rebase origin main; then
            if [ "$(git diff --name-only --diff-filter=U)" = "$MANIFEST" ]; then
              git checkout --theirs "$MANIFEST"
              git add "$MANIFEST"
              GIT_EDITOR=true git rebase --continue
            else
              git rebase --abort || true
              exit 1
            fi
          fi
          # This run succeeded, so drop a "not published" marker a failed run of the
          # same session left on main (the re-run's manifest may be byte-identical).
          if [ -f "$MANIFEST" ]; then
            python -m src.collection_manifest mark-published --path "$MANIFEST" --session "$COLLECTION_SESSION"
            git add "$MANIFEST"
            if ! git diff --cached --quiet; then
              git commit -m "Collection manifest (published) $COLLECTION_SESSION"
            fi
          fi
          if [ "$(git rev-list --count origin/main..HEAD)" = "0" ]; then
            echo "No data changes to commit"
          else
            git push origin HEAD:main
          fi

      # A failed, aborted, crashed or timed-out run keeps its data unpublished (as
      # before). Its manifest is published marked "data_published: false", so the
      # dashboard says the run failed instead of showing the previous run's coverage
      # or the runner's unpushed "stored" counts. The checkout is reset to origin/main
      # first, which drops any half-finished rebase or unpushed data commit.
      - name: Publish collection manifest after a failed run
        if: (failure() || cancelled()) && steps.session.outputs.eligible == 'true'
        env:
          COLLECTION_SESSION: ${{ steps.session.outputs.session_date }}
        run: |
          MANIFEST=data/collection_manifest.json
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Run on $GITHUB_REF, not main: manifest not published"; exit 0
          fi
          SAVED="$RUNNER_TEMP/collection_manifest.json"
          if [ -f "$MANIFEST" ]; then cp "$MANIFEST" "$SAVED"; fi
          git rebase --abort 2>/dev/null || true
          git fetch origin main
          git reset --hard origin/main
          git clean -fd data/
          if [ -f "$SAVED" ]; then cp "$SAVED" "$MANIFEST"; fi
          python -m src.collection_manifest mark-unpublished --path "$MANIFEST" --session "$COLLECTION_SESSION"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$MANIFEST"
          if git diff --cached --quiet; then
            echo "Manifest unchanged"
          else
            git commit -m "Collection manifest (failed run) $COLLECTION_SESSION"
            git push origin HEAD:main || { git pull --rebase origin main && git push origin HEAD:main; }
          fi
